version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-meal_tracker}
      MARIADB_USER: ${DB_USER:-meal_tracker}
      MARIADB_PASSWORD: ${DB_PASSWORD:-password}
      MARIADB_INITDB_SKIP_TZINFO: 1
    expose:
      - "3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      # Using the official MariaDB healthcheck script for maximum reliability
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  app:
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-meal_tracker}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-meal_tracker}
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  mariadb_data:
